<!doctype html>
<html lang="{{ site.Language.LanguageCode }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ .Title }}</title>
  <meta name="description" content="{{ .Description }}">
  <link rel="icon" type="image/svg+xml" href="{{ "icon.svg" | relURL }}">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ "favicon-32.png" | relURL }}">
  <link rel="icon" href="{{ "favicon.ico" | relURL }}" sizes="any">
  <link rel="apple-touch-icon" href="{{ "apple-touch-icon.png" | relURL }}">
  <meta name="theme-color" content="#1a66d6">
  <link rel="canonical" href="{{ .Permalink }}">
  {{ range .Site.Languages }}<link rel="alternate" hreflang="{{ .LanguageCode }}" href="{{ printf "/%s/" .Lang | absURL }}">{{ end }}
  <link rel="alternate" hreflang="x-default" href="{{ "/" | absURL }}">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Lite Simple Rust Browser">
  <meta property="og:title" content="{{ .Title }}">
  <meta property="og:description" content="{{ .Description }}">
  <meta property="og:url" content="{{ .Permalink }}">
  <meta property="og:locale" content="{{ replace site.Language.LanguageCode "-" "_" }}">
  <meta property="og:image" content="{{ "og.png" | absURL }}">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ .Title }}">
  <meta name="twitter:description" content="{{ .Description }}">
  <meta name="twitter:image" content="{{ "og.png" | absURL }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
  {{ $css := resources.Get "style.css" | minify | fingerprint }}
  <link rel="stylesheet" href="{{ $css.RelPermalink }}">
  {{ with site.Params.ga }}
  <script async src="https://www.googletagmanager.com/gtag/js?id={{ . }}"></script>
  <script src="{{ "analytics.js" | relURL }}" data-ga="{{ . }}"></script>
  {{ end }}
  {{ with site.Params.adsense }}
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client={{ . }}" crossorigin="anonymous"></script>
  {{ end }}
</head>
<body>
{{ block "main" . }}{{ end }}
{{ if site.Params.adsense }}<script src="{{ "ads.js" | relURL }}" defer></script>{{ end }}
</body>
</html>
