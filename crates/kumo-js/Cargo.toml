[package]
name = "kumo-js"
description = "Kumo JavaScript: Boa engine, DOM bindings, events, timers, fetch"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
kumo-dom.workspace = true
kumo-html.workspace = true
kumo-css.workspace = true
# annex-b：`substr`・`escape`・`__proto__` など、Web の古いスクリプトが広く使う関数（互換性のため必須）
boa_engine = { version = "0.22", default-features = false, features = ["annex-b"] }
boa_gc = "0.22"
boa_runtime = { version = "0.22", default-features = false, features = ["url"] }
url = "2.5"

[lints]
workspace = true

[dev-dependencies]
kumo-html.workspace = true
