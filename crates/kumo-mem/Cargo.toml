[package]
name = "kumo-mem"
description = "Tagged global allocator and process memory measurement for Kumo"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
mimalloc = { workspace = true }
libmimalloc-sys = { version = "0.1", default-features = false, features = ["extended", "v2"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_ProcessStatus", "Win32_System_Threading"] }

[lints.clippy]
all = { level = "warn", priority = -1 }
