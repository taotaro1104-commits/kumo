[package]
name = "kumo-viewer"
description = "Kumo browser: tabs, history, browser/content/network processes"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
kumo-browser.workspace = true
kumo-net.workspace = true
kumo-content.workspace = true
kumo-paint.workspace = true
kumo-mem.workspace = true
tiny-skia.workspace = true
winit.workspace = true
softbuffer.workspace = true
image.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.6", features = ["native-activity"] }
winit = { workspace = true, features = ["android-native-activity"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[lints]
workspace = true

[dev-dependencies]
url = "2.5"
