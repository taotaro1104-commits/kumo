[package]
name = "kumo-browser"
description = "Kumo browser process: tabs, session and visit history, browser UI"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
kumo-net.workspace = true
kumo-content.workspace = true
kumo-mem.workspace = true
url = "2.5"
percent-encoding = "2"
redb = "4"
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["use-std"] }
chacha20poly1305 = "0.11"
getrandom = "0.4"

# 暗号鍵は OS の資格情報ストアに置く（いまは Windows の資格情報マネージャ）
[target.'cfg(windows)'.dependencies]
keyring-core = "1"
windows-native-keyring-store = { version = "1", default-features = false }

[lints]
workspace = true

[dev-dependencies]
kumo-paint.workspace = true
kumo-mem.workspace = true
