[package]
name = "kumo-browser"
description = "Kumo browser process: tabs, session and visit history, browser UI"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
kumo-net.workspace = true
kumo-content.workspace = true
kumo-mem.workspace = true
url = "2.5"
percent-encoding = "2"
redb = "4"
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["use-std"] }

[lints]
workspace = true

[dev-dependencies]
kumo-paint.workspace = true
kumo-mem.workspace = true
